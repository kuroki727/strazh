name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            compiler: g++
            build_type: Debug
            sanitizers: 'OFF'
          - name: GCC Release
            compiler: g++
            build_type: Release
            sanitizers: 'OFF'
          - name: Clang ASan UBSan
            compiler: clang++
            build_type: Debug
            sanitizers: 'ON'
    name: ${{ matrix.name }}
    env:
      STRAZH_REQUIRE_INTEGRATION: '1'
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON -DSTRAZH_WERROR=ON
          -DSTRAZH_ASAN=${{ matrix.sanitizers }}
          -DSTRAZH_UBSAN=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build -j2
      - name: Test including named Unix sockets
        run: ctest --test-dir build --output-on-failure
